[package]
name = "tidalv2"
version = "0.2.0"
authors = ["Patrick Hayes <patrick.d.hayes@gmail.com>"]
description = "Rust client library for TIDAL's v2 JSON:API - type-safe access to TIDAL's music catalog and streaming services"
license = "Unlicense"
edition = "2024"
repository = "https://github.com/phayes/tidalv2"
homepage = "https://github.com/phayes/tidalv2"
documentation = "https://docs.rs/tidalv2"
readme = "README.md"
keywords = ["tidal", "music", "streaming", "api", "jsonapi"]
categories = ["api-bindings", "multimedia::audio"]

[features]
default = []
tidalrs = ["dep:tidalrs"]

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
reqwest = { version = "^0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tidalrs = { version = "0.5", optional = true }
log = "^0.4"
strum = { version = "0.28", features = ["derive"] }
strum_macros = { version = "0.28"}
thiserror = "^2.0"
arc-swap = "^1.7"
async-recursion = "^1.0"
tokio = { version = "1.0"}
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1.0", features = ["full"] }